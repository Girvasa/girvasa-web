name: Web CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build (Node 20.x)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20.18.0 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Lint source code
        run: npm run lint

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Build production Next.js standalone application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: npm run build

      - name: Verify standalone build output
        run: |
          test -f .next/standalone/server.js || { echo "Standalone server.js missing!"; exit 1; }
          echo "Next.js standalone build output verified successfully."

      - name: Build Web Docker Image
        run: docker build -t girvasa-web:ci .

